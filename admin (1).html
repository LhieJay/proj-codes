<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard | TechPulse Innovations</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#0D6FFD;--primary-dark:#0A58CA;--dark:#1E293B;--light:#F8FAFC;--muted:#526077;--border:#E2E8F0;--tint:#EAF3FF;--ok:#067647;--bad:#B42318;--warn:#B54708;--radius:14px;--head:"Poppins",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;font-family:var(--body);color:var(--dark);background:#F1F5F9;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}button{font-family:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.9rem;padding:10px 18px;border-radius:10px;border:2px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn.ghost{background:#fff;color:var(--primary)}.btn.ghost:hover{background:var(--tint)}
.btn.danger{background:#fff;color:var(--bad);border-color:#F1B8B2}.btn.danger:hover{background:#FEF3F2}
.btn.sm{padding:6px 12px;font-size:.82rem}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border:1px solid var(--border);background:#fff;border-radius:8px;color:var(--muted);cursor:pointer}
.icon-btn:hover{color:var(--primary);border-color:var(--primary)}.icon-btn.bad:hover{color:var(--bad);border-color:var(--bad)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#0F2A5C,#0D6FFD)}
.login-card{background:#fff;border-radius:var(--radius);padding:32px;width:min(400px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:600;font-size:1.2rem}
.logo svg{width:32px;height:32px}
.login-card h1{font-family:var(--head);font-size:1.4rem;margin:20px 0 4px}.login-card p.sub{margin:0 0 20px;color:var(--muted)}
.hint{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:.85rem;color:var(--primary-dark);margin-top:16px}
.field{margin-bottom:14px}label{display:block;font-weight:500;font-size:.88rem;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #CBD5E1;border-radius:10px;font:inherit;color:var(--dark);background:#fff}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(13,111,253,.25);border-color:var(--primary)}
.error{color:var(--bad);font-size:.85rem;margin:4px 0 0;min-height:1.1em}
/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--dark);color:#CBD5E1;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.side .logo{color:#fff;padding:0 8px 20px}
.side small{padding:0 12px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#7C8BA3;margin:8px 0}
.side nav{display:grid;gap:4px}
.nav-a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;font-weight:500;font-size:.93rem;color:#CBD5E1}
.nav-a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-a[aria-current="page"]{background:var(--primary);color:#fff}
.badge{margin-left:auto;background:#F04438;color:#fff;border-radius:99px;font-size:.72rem;font-weight:700;padding:1px 8px}
.side .bottom{margin-top:auto;display:grid;gap:4px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:14px 28px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top h1{font-family:var(--head);font-size:1.25rem;margin:0}
.top .spacer{flex:1}
.live{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--ok);font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:#12B76A;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.me{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:500}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;font:600 .8rem var(--head);flex:none}
.menu-btn{display:none}
#view{padding:28px;outline:none}
/* cards */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h2{font-family:var(--head);font-size:1.05rem;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.card h2 a{font:600 .82rem var(--body);color:var(--primary)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{display:flex;gap:14px;align-items:center}
.stat .ico{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--primary);display:grid;place-items:center;flex:none}
.stat b{display:block;font:600 1.6rem var(--head);line-height:1.1}.stat span{font-size:.84rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:20px}
.chart{width:100%;height:auto}.cv{font:600 11px var(--body);fill:#1E293B}.cl{font:11px var(--body);fill:#526077}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:.9rem}.list li:last-child{border:0}
.list .grow{flex:1;min-width:0}.list .grow div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list small{color:var(--muted)}
.bar-row{margin-bottom:12px;font-size:.88rem}.bar-row div.t{display:flex;justify-content:space-between;margin-bottom:4px}
.bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--primary)}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
/* tables */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.toolbar .search{position:relative;flex:1;min-width:200px}.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.toolbar .search input{padding-left:38px}.toolbar select{width:auto}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px;min-width:180px}.who small{display:block;color:var(--muted)}
.actions{display:flex;gap:6px;justify-content:flex-end}
.s-active{background:#ECFDF3;color:var(--ok)}.s-suspended{background:#FEF3F2;color:var(--bad)}.r-staff{background:#F4F3FF;color:#5925DC}.r-client{background:#F1F5F9;color:var(--muted)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font-size:.86rem;color:var(--muted);flex-wrap:wrap}.pager div{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.fchip{border:1px solid var(--border);background:#fff;color:var(--muted);padding:6px 14px;border-radius:99px;font:500 .84rem var(--body);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
/* inbox */
.inbox{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
.msg-list{max-height:70vh;overflow:auto}
.msg{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--border);cursor:pointer;width:100%;text-align:left;background:#fff;border-left:0;border-right:0;border-top:0}
.msg:hover{background:var(--light)}.msg.sel{background:var(--tint)}
.msg .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;background:transparent;flex:none}.msg.unread .dot{background:var(--primary)}
.msg.unread b{font-weight:700}.msg b{font-weight:500}.msg .grow{flex:1;min-width:0}
.msg .grow div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.msg small{color:var(--muted)}
.detail h2{display:block;font-size:1.2rem}.meta{color:var(--muted);font-size:.88rem;margin:0 0 16px}
.body{white-space:pre-wrap;background:var(--light);border-radius:10px;padding:16px;margin:16px 0;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px}
.star-on{color:#F79009;fill:#F79009}
/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:20px;z-index:100;overflow:auto}
.dialog{background:#fff;border-radius:var(--radius);padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto}
.dialog h2{font-family:var(--head);font-size:1.2rem;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}
.dialog .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:.9rem;margin-bottom:16px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:200}
.toast{background:var(--dark);color:#fff;padding:12px 18px;border-radius:10px;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.set-grid .card p{color:var(--muted);font-size:.9rem;margin:0 0 14px}
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.grid2,.inbox,.set-grid{grid-template-columns:1fr}}
@media (max-width:820px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .25s}.side.open{transform:none}
 .menu-btn{display:inline-grid}.top{padding:12px 16px}#view{padding:16px}.me span{display:none}
}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ ADMIN LOGIN ============ -->
<div class="login" id="loginScreen" hidden>
  <div class="login-card">
    <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0D6FFD"/><path d="M8 9h16v5h-5.5v10h-5V14H8z" fill="#fff"/></svg> TechPulse Admin</div>
    <h1>Admin sign in</h1><p class="sub">Manage users, messages and activity.</p>
    <div class="field"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="username" placeholder="admin@techpulse.dev"></div>
    <div class="field"><label for="a-pw">Password</label><input id="a-pw" type="password" autocomplete="current-password" placeholder="Enter your password"></div>
    <p class="error" id="a-err" role="alert"></p>
    <button class="btn" id="a-go" type="button" style="width:100%">Sign in</button>
    <div class="hint" id="a-hint">Demo login: <b>admin@techpulse.dev</b> / <b>Admin@123</b>. Change it in Settings after signing in.</div>
  </div>
</div>

<!-- ============ ADMIN APP ============ -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0D6FFD"/><path d="M8 9h16v5h-5.5v10h-5V14H8z" fill="#fff"/></svg> TechPulse</div>
    <small>Manage</small>
    <nav aria-label="Admin">
      <a class="nav-a" href="#/" data-nav="overview" id="n-overview"></a>
      <a class="nav-a" href="#/users" data-nav="users" id="n-users"></a>
      <a class="nav-a" href="#/messages" data-nav="messages" id="n-messages"></a>
      <a class="nav-a" href="#/activity" data-nav="activity" id="n-activity"></a>
      <a class="nav-a" href="#/settings" data-nav="settings" id="n-settings"></a>
    </nav>
    <div class="bottom">
      <a class="nav-a" href="index.html" target="_blank" rel="noopener" id="n-site"></a>
      <button class="nav-a" id="n-out" data-act="logout" type="button" style="background:none;border:0;cursor:pointer;text-align:left;width:100%"></button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" data-act="menu" type="button" aria-label="Open menu" id="b-menu"></button>
      <h1 id="pageTitle">Overview</h1><span class="spacer"></span>
      <span class="live"><i></i> Live</span>
      <div class="me"><div class="avatar" id="meAv">A</div><span id="meName">Admin</span></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="dialog" id="dlg" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
/* ======================================================================
   TechPulse Admin Dashboard
   Reads the data the website writes to the browser's localStorage:
   tp_users, tp_messages, tp_activity. Put this file in the SAME folder as
   the website (index.html) so both share the same storage.
   DEMO ONLY: replace storage + sign-in with a real backend before launch.
   ====================================================================== */
const $=id=>document.getElementById(id),$$=s=>[...document.querySelectorAll(s)];
const MEM={},store={
  get:k=>{try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return MEM[k]===undefined?null:MEM[k]},
  set:(k,v)=>{MEM[k]=v;try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{delete MEM[k];try{localStorage.removeItem(k)}catch(e){}}};
const rd=(k,d)=>{try{const v=JSON.parse(store.get(k));return v==null?d:v}catch(e){return d}};
const wr=(k,v)=>store.set(k,JSON.stringify(v));
const K={users:'tp_users',msgs:'tp_messages',act:'tp_activity',adm:'tp_admin',ses:'tp_admin_session'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I={
 dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
 act:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
 set:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
 trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.3L5.8 21 7 14.2 2 9.3l6.9-1z"/>',
 ban:'<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
 key:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',
 dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 reply:'<path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>',
 ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'
};
const ic=(k,c)=>'<svg class="ic'+(c?' '+c:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+I[k]+'</svg>';
const NAVI={overview:['dash','Overview'],users:['users','Users'],messages:['mail','Messages'],activity:['act','Activity log'],settings:['set','Settings']};
Object.keys(NAVI).forEach(k=>{$('n-'+k).innerHTML=ic(NAVI[k][0])+'<span>'+NAVI[k][1]+'</span>'+(k==='messages'?'<span class="badge" id="unreadBadge" hidden>0</span>':'')});
$('n-site').innerHTML=ic('ext')+'<span>View website</span>';$('n-out').innerHTML=ic('out')+'<span>Sign out</span>';$('b-menu').innerHTML=ic('menu');

/* ---------- Data helpers ---------- */
const users=()=>Object.values(rd(K.users,{})).map(u=>Object.assign({role:'client',status:'active',createdAt:0,lastLogin:null},u));
const saveUser=u=>{const m=rd(K.users,{});m[u.email]=u;wr(K.users,m)};
const msgs=()=>rd(K.msgs,[]),acts=()=>rd(K.act,[]);
function log(type,detail,user){const a=acts();a.push({id:Date.now()+Math.random().toString(36).slice(2,6),t:Date.now(),type,user:user||'Admin',detail});wr(K.act,a.slice(-1000))}
const TYPES={view:['Page view','#475569','#F1F5F9'],signup:['Sign up','#0A58CA','#EAF3FF'],login:['Login','#067647','#ECFDF3'],failed:['Failed login','#B42318','#FEF3F2'],logout:['Logout','#475569','#F1F5F9'],message:['Message','#5925DC','#F4F3FF'],request:['Service request','#B54708','#FFFAEB'],file:['File shared','#0E7090','#ECFDFF'],admin:['Admin action','#1E293B','#E2E8F0']};
const chip=t=>{const x=TYPES[t]||[t,'#475569','#F1F5F9'];return '<span class="chip" style="color:'+x[1]+';background:'+x[2]+'">'+x[0]+'</span>'};
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const fmt=t=>t?new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const fmtD=t=>t?new Date(t).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}):'-';
function ago(t){const s=Math.max(0,(Date.now()-t)/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago'}
const nameOf=em=>{const u=(rd(K.users,{}))[em];return u?u.name:em};
const who=em=>em==='Visitor'||em==='Admin'?'<div class="who"><div class="avatar">'+(em==='Admin'?'A':'V')+'</div><div>'+em+'</div></div>':'<div class="who"><div class="avatar">'+esc(ini(nameOf(em)))+'</div><div>'+esc(nameOf(em))+(nameOf(em)!==em?'<small>'+esc(em)+'</small>':'')+'</div></div>';
const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
async function hash(s){if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}return btoa(unescape(encodeURIComponent(s)))}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('toasts').append(t);setTimeout(()=>t.remove(),3200)}
function csv(rows){return rows.map(r=>r.map(v=>{v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}).join(',')).join('\n')}
function download(name,text,mime){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Downloaded '+name)}catch(e){toast('Download is not available here.')}}
function pager(total,page,size,k){const pages=Math.max(1,Math.ceil(total/size)),a=total?(page-1)*size+1:0,b=Math.min(total,page*size);

function barChart(vals,labels){const W=560,H=190,pad=28,max=Math.max(1,...vals),bw=(W-pad*2)/vals.length;
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Activity in the last 7 days" class="chart">'+vals.map((v,i)=>{const h=Math.round((H-pad-26)*v/max),x=pad+i*bw+bw*.2,y=H-pad-h;
  return '<rect x="'+x+'" y="'+y+'" width="'+(bw*.6)+'" height="'+h+'" rx="5" fill="#0D6FFD"/><text x="'+(x+bw*.3)+'" y="'+(y-6)+'" text-anchor="middle" class="cv">'+v+'</text><text x="'+(x+bw*.3)+'" y="'+(H-8)+'" text-anchor="middle" class="cl">'+labels[i]+'</text>'}).join('')+'<line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+(H-pad)+'" y2="'+(H-pad)+'" stroke="#E2E8F0"/></svg>'}
function viewOverview(){

   today:A.filter(a=>a.type==='view'&&now-a.t<day).length,online:new Set(A.filter(a=>now-a.t<5*6e4&&a.user&&a.user!=='Admin'&&a.user!=='Visitor').map(a=>a.user)).size};
  const days=[],labels=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const s=d.getTime();days.push(A.filter(a=>a.type!=='admin'&&a.t>=s&&a.t<s+day).length);labels.push(d.toLocaleDateString([],{weekday:'short'}))}
  const topics={};M.forEach(m=>{if(m.topic)topics[m.topic]=(topics[m.topic]||0)+1});const tl=Object.entries(topics).sort((a,b)=>b[1]-a[1]).slice(0,5),tmax=tl.length?tl[0][1]:1;
  const card=(ico,n,l)=>'<div class="card stat"><div class="ico">'+ic(ico)+'</div><div><b>'+n+'</b><span>'+l+'</span></div></div>';
  const recentA=A.filter(a=>a.type!=='view').slice(-7).reverse(),recentM=M.slice().sort((a,b)=>b.t-a.t).slice(0,5);
  $('view').innerHTML='<div class="stats">'+card('users',st.total,'Total users ('+st.newW+' new this week)')+card('act',st.online,'Online now ('+st.active+' active this week)')+card('mail',st.unread,'Unread messages ('+M.length+' total)')+card('eye',st.today,'Page views today')+'</div>'
  +(!U.length&&!M.length&&!A.length?'<div class="card" style="margin-bottom:20px"><h2>No data yet</h2><p style="margin:0 0 14px;color:var(--muted)">Open the website in this browser, sign up, browse and send a message, and it will show here live. Or load sample data to preview the dashboard.</p><button class="btn" data-act="seed" type="button">Load sample data</button></div>':'')
  +'<div class="grid2"><div class="card"><h2>Activity, last 7 days</h2>'+barChart(days,labels)+'</div>'
  +'<div class="card"><h2>Top requested services</h2>'+(tl.length?tl.map(t=>'<div class="bar-row"><div class="t"><span>'+esc(t[0])+'</span><b>'+t[1]+'</b></div><div class="bar"><span style="width:'+Math.round(t[1]/tmax*100)+'%"></span></div></div>').join(''):'<div class="empty">No service requests yet.</div>')+'</div></div>'

  const ms=msgs();texts.forEach((t,i)=>{const e=emails[i];ms.push({id:'demo'+now+i,name:names[i],email:e,topic:pick(SVC),text:t,t:now-R(6*day)-R(day),read:i>3,starred:i===1,replied:i===5,userEmail:e})});wr(K.msgs,ms);

 /* users */
 openUser(d){const u=getU(d.e);if(!u)return;const ev=acts().filter(a=>a.user===u.email).slice(-12).reverse(),ms=msgs().filter(m=>m.email===u.email||m.userEmail===u.email);
  openModal('<h2>'+esc(u.name)+'<button class="icon-btn" data-act="close" type="button" aria-label="Close">'+ic('x','sm')+'</button></h2><dl class="kv"><dt>Email</dt><dd>'+esc(u.email)+'</dd><dt>Role</dt><dd>'+esc(u.role||'client')+'</dd><dt>Status</dt><dd>'+esc(u.status||'active')+'</dd><dt>Joined</dt><dd>'+fmtD(u.createdAt)+'</dd><dt>Last login</dt><dd>'+(u.lastLogin?fmt(u.lastLogin):'Never')+'</dd><dt>Messages sent</dt><dd>'+ms.length+'</dd><dt>Events</dt><dd>'+acts().filter(a=>a.user===u.email).length+'</dd></dl>'
  +'<b style="font-size:.9rem">Recent activity</b>'+(ev.length?'<ul class="list">'+ev.map(a=>'<li>'+chip(a.type)+'<div class="grow">'+esc(a.detail)+'</div><small>'+fmt(a.t)+'</small></li>').join('')+'</ul>':'<p style="color:var(--muted)">No activity yet.</p>')+'<div class="foot"><button class="btn ghost" data-act="close" type="button">Close</button></div>')},
 editUser(d){const u=getU(d.e);if(!u)return;openModal('<h2>Edit user</h2>'+userForm(Object.assign({role:'client',status:'active'},u),false)+'<div class="foot"><button class="btn ghost" data-act="close" type="button">Cancel</button><button class="btn" data-act="saveEdit" data-e="'+esc(u.email)+'" type="button" data-primary>Save changes</button></div>')},
 saveEdit(d){const u=getU(d.e),n=$('m-name').value.trim();if(n.length<2)return mErr('Enter a name.');u.name=n;u.role=$('m-role').value;const was=u.status;u.status=$('m-status').value;saveUser(u);log('admin','Edited user '+u.email+(was!==u.status?' ('+u.status+')':''));toast('User updated.');closeModal()},
 addUser(){openModal('<h2>Add user</h2>'+userForm({role:'client'},true)+'<div class="foot"><button class="btn ghost" data-act="close" type="button">Cancel</button><button class="btn" data-act="saveAdd" type="button" data-primary>Create user</button></div>')},
 async saveAdd(){const n=$('m-name').value.trim(),e=$('m-email').value.trim().toLowerCase(),p=$('m-pw').value;
  if(n.length<2)return mErr('Enter a name.');if(!emailOk(e))return mErr('Enter a valid email.');if(p.length<8)return mErr('Password must be at least 8 characters.');if(getU(e))return mErr('A user with this email already exists.');
  saveUser({name:n,email:e,hash:await hash(p),role:$('m-role').value,status:'active',createdAt:Date.now(),lastLogin:null});log('admin','Created user '+e);toast('User created.');closeModal()},
 toggleStatus(d){const u=getU(d.e);if(!u)return;u.status=u.status==='suspended'?'active':'suspended';saveUser(u);log('admin',(u.status==='suspended'?'Suspended ':'Activated ')+u.email);toast(u.name+' is now '+u.status+'.');REDRAW();badge()},
 resetPw(d){const u=getU(d.e);if(!u)return;openModal('<h2>Reset password</h2><p style="margin:0 0 14px;color:var(--muted)">Set a new password for '+esc(u.name)+'. Share it with them securely.</p><div class="field"><label for="m-pw">New password</label><input id="m-pw" type="text" placeholder="At least 8 characters"></div><p class="error" id="mErr" role="alert"></p><div class="foot"><button class="btn ghost" data-act="close" type="button">Cancel</button><button class="btn" data-act="savePw" data-e="'+esc(u.email)+'" type="button" data-primary>Set password</button></div>')},
 async savePw(d){const p=$('m-pw').value;if(p.length<8)return mErr('Password must be at least 8 characters.');const u=getU(d.e);u.hash=await hash(p);saveUser(u);log('admin','Reset password for '+u.email);toast('Password updated.');closeModal()},
 delUser(d){const u=getU(d.e);if(!u)return;confirmBox('Delete user?','This permanently deletes '+u.name+' ('+u.email+'). Their messages and activity history are kept.','Delete user',()=>{const m=rd(K.users,{});delete m[u.email];wr(K.users,m);log('admin','Deleted user '+u.email);toast('User deleted.');REDRAW()})},
 exportUsers(){download('techpulse-users.csv',csv([['Name','Email','Role','Status','Joined','Last login']].concat(filteredUsers().map(u=>[u.name,u.email,u.role,u.status,fmtD(u.createdAt),u.lastLogin?fmt(u.lastLogin):'Never']))),'text/csv')},
 /* messages */
 selmsg(d){S.msel=d.id;patchMsg(d.id,m=>m.read=true);badge();drawMessages()},
 star(d){patchMsg(d.id,m=>m.starred=!m.starred);drawMessages()},
 toggleRead(d){patchMsg(d.id,m=>m.read=false);S.msel=null;badge();drawMessages()},
 replied(d){patchMsg(d.id,m=>m.replied=!m.replied);drawMessages()},
 reply(d){patchMsg(d.id,m=>{m.replied=true;m.read=true});log('admin','Replied to a message');setTimeout(drawMessages,200)},
 delMsg(d){confirmBox('Delete message?','This message will be permanently deleted.','Delete',()=>{wr(K.msgs,msgs().filter(m=>m.id!==d.id));S.msel=null;badge();toast('Message deleted.');drawMessages()})},
 markAllRead(){const L=msgs();L.forEach(m=>m.read=true);wr(K.msgs,L);badge();drawMessages();toast('All messages marked as read.')},
 /* activity */
 exportAct(){download('techpulse-activity.csv',csv([['Time','Event','User','Name','Details']].concat(filteredAct().map(a=>[new Date(a.t).toISOString(),(TYPES[a.type]||[a.type])[0],a.user,nameOf(a.user),a.detail]))),'text/csv')},
 clearAct(){confirmBox('Clear activity log?','All recorded activity will be deleted.','Clear log',()=>{wr(K.act,[]);toast('Activity log cleared.');drawActivity()})},
 /* settings */
 saveProfile(){const n=$('p-name').value.trim(),e=$('p-email').value.trim().toLowerCase();if(n.length<2)return $('pErr').textContent='Enter a name.';if(!emailOk(e))return $('pErr').textContent='Enter a valid email.';
  const rec=rd(K.adm,null);if(rec){rec.name=n;rec.email=e;wr(K.adm,rec)}wr(K.ses,Object.assign(adminSess(),{name:n,email:e}));toast('Profile saved.');render()},
 async savePwAdmin(){const o=$('c-old').value,n=$('c-new').value,err=$('cErr');err.textContent='';if(n.length<8)return err.textContent='New password must be at least 8 characters.';
  const rec=rd(K.adm,null),okOld=rec?rec.hash===await hash(o):o==='Admin@123';if(!okOld)return err.textContent='Current password is incorrect.';
  wr(K.adm,{email:adminSess().email,name:adminSess().name,hash:await hash(n)});log('admin','Changed admin password');toast('Password updated.');$('c-old').value=$('c-new').value=''},
 exportAll(){download('techpulse-backup.json',JSON.stringify({users:rd(K.users,{}),messages:msgs(),activity:acts()},null,2),'application/json')},
 resetAll(){confirmBox('Delete all data?','This removes every user, message and activity record. This cannot be undone.','Delete everything',()=>{wr(K.users,{});wr(K.msgs,[]);wr(K.act,[]);toast('All data deleted.');render()})}
};
document.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('a[href^="#/"]');if(a){e.preventDefault();go(a.getAttribute('href').slice(1));return}
  if(e.target===$('overlay')){closeModal();return}
  const b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(!f)return;
  if(b.tagName!=='A')e.preventDefault();f(b.dataset,b)});
const bind=e=>{const t=e.target;if(!t.dataset||!t.dataset.bind)return;S[t.dataset.bind]=t.value;if(t.dataset.page)S[t.dataset.page]=1;REDRAW()};
document.addEventListener('input',bind);document.addEventListener('change',bind);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('overlay').hidden)closeModal();
  if(e.key==='Enter'&&!$('overlay').hidden&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='BUTTON'){const p=$('dlg').querySelector('[data-primary]');if(p){e.preventDefault();p.click()}}});
$('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.users)wr(K.users,d.users);if(d.messages)wr(K.msgs,d.messages);if(d.activity)wr(K.act,d.activity);toast('Backup restored.');render()}catch(x){toast('That file is not a valid backup.')}e.target.value=''};r.readAsText(f)});

/* ---------- Admin sign in ---------- */
async function signIn(){
  const em=$('a-email').value.trim().toLowerCase(),pw=$('a-pw').value,err=$('a-err');err.textContent='';
  if(!emailOk(em)||!pw){err.textContent='Enter your email and password.';return}
  let rec=rd(K.adm,null),ok;
  if(rec)ok=rec.email===em&&rec.hash===await hash(pw);
  else{ok=em==='admin@techpulse.dev'&&pw==='Admin@123';if(ok){rec={email:em,name:'Admin',hash:await hash(pw)};wr(K.adm,rec)}}
  if(!ok){err.textContent='Email or password is incorrect.';return}
  wr(K.ses,{email:rec.email,name:rec.name||'Admin',t:Date.now()});log('admin','Admin signed in');go('/')}
$('a-go').addEventListener('click',signIn);
$('loginScreen').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();signIn()}});
if(rd(K.adm,null))$('a-hint').textContent='Sign in with your admin email and password.';
render();
</script>
</body>
